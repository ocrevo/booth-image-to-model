name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests without Blender (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python packages
        run: python -m pip install -r booth-image-to-model/requirements.txt
      - name: Line endings
        run: python tools/check_lf.py
      - name: Docs, links and private traces
        run: python tools/check_docs.py
      - name: Skill tests (Blender tests skip)
        run: python booth-image-to-model/tests/run_tests.py --output ci-out/skill
      - name: Evaluation harness tests (no Blender)
        run: python -m unittest discover -s tools/eval/tests
      - name: Web unit tests
        working-directory: web
        env:
          PYTHON: python
        run: npm test
      - name: Web server tests
        working-directory: web
        env:
          PYTHON: python
        run: npm run test:server
