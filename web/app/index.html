<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booth Spec Editor</title>
  <meta name="description" content="Static, client-side editor for a booth-image-to-model spec. Nothing is uploaded.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/editor.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <header class="bar">
    <div class="brand">
      <strong data-i18n="title">Booth Spec Editor</strong>
      <span class="file" id="fileName"></span>
    </div>
    <div class="tools" role="toolbar">
      <button id="btnOpen" data-i18n="open"></button>
      <button id="btnDemo" data-i18n="demo"></button>
      <button id="btnSave" class="primary" data-i18n="save"></button>
      <button id="btnGlb" data-i18n="glb"></button>
      <span class="sep"></span>
      <button id="btnUndo" data-i18n="undo"></button>
      <button id="btnRedo" data-i18n="redo"></button>
      <span class="sep"></span>
      <button id="btnMove" data-i18n="move" class="toggle"></button>
      <button id="btnRotate" data-i18n="rotate" class="toggle"></button>
      <label class="check"><input type="checkbox" id="chkSnap" checked> <span data-i18n="snap"></span></label>
      <span class="sep"></span>
      <button id="btnDup" data-i18n="dup"></button>
      <button id="btnDel" data-i18n="del"></button>
      <span class="sep"></span>
      <button id="btnMatch" data-i18n="match" class="toggle"></button>
      <button id="btnFrame" data-i18n="frame"></button>
      <span class="grow"></span>
      <button id="btnGuide" data-i18n="guide"></button>
    </div>
    <input type="file" id="fileInput" accept=".json,application/json" hidden>
  </header>

  <main class="layout">
    <aside class="panel" id="outlinePanel">
      <h2 data-i18n="outline"></h2>
      <input type="search" id="filter" class="filter">
      <div id="outlineList" class="outline"></div>
    </aside>

    <section class="stage" id="stage">
      <div class="drop" id="dropHint" hidden data-i18n="drop"></div>
    </section>

    <aside class="panel" id="inspector"></aside>
  </main>

  <footer class="status">
    <span id="message" class="message"></span>
    <button id="btnIssues" class="issues"></button>
  </footer>
  <section class="issue-list" id="issueList" hidden></section>

  <dialog id="guide">
    <form method="dialog">
      <h2 id="guideTitle"></h2>
      <p id="guideSub" class="hint"></p>
      <ol id="guideBody"></ol>
      <button data-i18n="close"></button>
    </form>
  </dialog>

  <noscript>This editor needs JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
