<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booth studio</title>
  <meta name="description" content="From a booth picture to an editable model and a clean render, in one window. Needs the local studio server.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/editor.css">
  <link rel="stylesheet" href="css/studio.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
</head>
<body class="studio" data-editor="embedded" data-phase="empty">
  <header class="bar st-bar">
    <div class="st-brand">
      <strong id="appName"></strong>
      <span class="file" id="photoName"></span>
    </div>
    <nav id="steps" class="st-steps" aria-label="Progress"></nav>
    <span class="grow"></span>
    <span id="saveChip" class="st-chip" role="status" hidden></span>
    <span id="envChip" class="st-chip warn" role="alert" hidden></span>
    <button id="btnNew" hidden></button>
    <button id="btnPro" aria-expanded="false"></button>
  </header>

  <main class="studio-main no-outline" id="studioMain">
    <aside class="panel st-outline" id="outlinePanel" hidden>
      <h2 id="partsTitle"></h2>
      <input type="search" id="filter" class="filter">
      <div id="outlineList" class="outline"></div>
    </aside>

    <section class="stage" id="stage">
      <label class="st-drop" id="dropZone" for="imageInput">
        <span class="st-drop-title" id="dropTitle"></span>
        <span class="st-drop-small" id="dropSmall"></span>
        <input type="file" id="imageInput" accept="image/png,image/jpeg">
        <span class="st-recent" id="recent" hidden></span>
      </label>
      <img id="photoPlain" class="st-photo-plain" alt="" hidden>

      <div class="st-tools" id="stageTools" role="toolbar" hidden>
        <button id="btnMove" class="toggle"></button>
        <button id="btnRotate" class="toggle"></button>
        <label class="check"><input type="checkbox" id="chkSnap" checked> <span id="snapLabel"></span></label>
        <span class="sep"></span>
        <button id="btnDup"></button>
        <button id="btnDel"></button>
        <span class="sep"></span>
        <button id="btnUndo"></button>
        <button id="btnRedo"></button>
      </div>

      <div class="st-compare" id="compareBar" hidden>
        <div class="st-seg" id="viewSeg" role="group" aria-label="Compare mode"></div>
        <input type="range" id="splitSlider" min="0" max="100" value="50" aria-label="Compare divider">
        <div class="st-seg" id="afterSeg" role="group" aria-label="Model shown"></div>
        <span class="st-note" id="compareNote"></span>
      </div>
    </section>

    <aside class="st-rail" id="rail">
      <section id="stepCard" class="st-card"></section>
      <section id="inspector" class="panel st-inspector" hidden></section>
    </aside>
  </main>

  <footer class="status">
    <span id="message" class="message"></span>
    <button id="btnIssues" class="issues"></button>
  </footer>
  <section class="issue-list" id="issueList" hidden></section>

  <aside id="pro" class="st-pro" hidden aria-label="Advanced view">
    <header>
      <div class="st-seg" id="proTabs" role="tablist"></div>
      <span class="grow"></span>
      <button id="btnProClose" aria-label="Close">×</button>
    </header>
    <div id="proBody" class="st-pro-body"></div>
  </aside>

  <noscript>This page needs JavaScript.</noscript>
  <script type="module" src="js/studio.js"></script>
</body>
</html>
